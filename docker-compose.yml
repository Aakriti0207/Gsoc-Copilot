services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gsoc_copilot
      POSTGRES_USER: gsoc_copilot
      POSTGRES_PASSWORD: gsoc_copilot
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gsoc_copilot -d gsoc_copilot"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
